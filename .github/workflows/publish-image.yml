name: Publish image

# Builds the container image for amd64 and arm64 and publishes both under
# the same tags (#318), for dev-image.yml and release.yml. Each platform
# builds natively on its own runner (GitHub's ubuntu-24.04-arm runners are
# free for public repositories) rather than under QEMU emulation, which is
# several times slower for pnpm install and the build. Each build pushes
# by digest only; the merge job then points the tags at both.

on:
  workflow_call:
    inputs:
      tags:
        description: Image tags to publish, one per line (e.g. ghcr.io/jshields-ca/latestarr:dev)
        required: true
        type: string
      version:
        description: The org.opencontainers.image.version label
        required: true
        type: string
      ref:
        description: The git ref to build (defaults to the triggering commit)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

# Forced lowercase: GHCR (like all OCI registries) rejects uppercase
# repository paths, and this repo's own name has a capital A/R.
env:
  IMAGE: ghcr.io/jshields-ca/latestarr

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Record the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish tags
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point the tags at both platforms
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)

      - name: Check both platforms are published
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          first=$(printf '%s\n' "$TAGS" | sed -n '/./{p;q;}')
          docker buildx imagetools inspect "$first"
          docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | grep -q '"architecture":"arm64"'
          docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | grep -q '"architecture":"amd64"'
