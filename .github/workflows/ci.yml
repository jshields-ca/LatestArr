name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is what the Docker image runs; 24 is the next LTS the image
        # will move to. Node 20 reached end of life in April 2026.
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every setting documented in .env.example has to be passed into the
      # container, or setting it in .env silently does nothing.
      - name: Check docker-compose.yml passes every .env.example setting
        run: |
          missing=0
          for key in $(grep -oE '^[A-Z_]+=' .env.example | tr -d =); do
            if ! grep -qF "\${$key" docker-compose.yml; then
              echo "::error file=docker-compose.yml::$key is documented in .env.example but never passed into the container"
              missing=1
            fi
          done
          exit $missing

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build

      - name: Test
        run: pnpm turbo run test

  # Only runs on the Version Packages PR: fails until this version's
  # highlights file exists, so the release can't be merged without them
  # by accident (the release workflow also posts a reminder comment).
  release-highlights:
    name: Release highlights
    if: github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check this release has highlights
        run: node scripts/build-release-notes.mjs --check-highlights "$(node -p "require('./package.json').version")"

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: latestarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          docker run -d --name latestarr-smoke -p 3000:3000 latestarr:ci
          healthy=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Health check passed"
              healthy=true
              break
            fi
            sleep 1
          done
          if [ "$healthy" != "true" ]; then
            echo "Health check never succeeded; container logs:"
            docker logs latestarr-smoke
            exit 1
          fi

          # The admin WebUI must be served from this same container/origin,
          # with every backend route living under /api so it never collides
          # with a client-side route of the same name.
          echo "Checking the admin WebUI is served..."
          root_body="$(curl -sf http://localhost:3000/)"
          echo "$root_body" | grep -q '<div id="root">' || {
            echo "Root path did not return the SPA shell:"; echo "$root_body"; docker logs latestarr-smoke; exit 1;
          }

          echo "Checking a client-side route falls back to the SPA shell..."
          sources_page_body="$(curl -sf http://localhost:3000/sources)"
          echo "$sources_page_body" | grep -q '<div id="root">' || {
            echo "/sources did not return the SPA shell:"; echo "$sources_page_body"; docker logs latestarr-smoke; exit 1;
          }

          echo "Checking the API is reachable under /api..."
          providers_status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/auth/providers)"
          if [ "$providers_status" != "200" ]; then
            echo "GET /api/auth/providers returned $providers_status, expected 200"; docker logs latestarr-smoke; exit 1;
          fi

          echo "All smoke checks passed"

      - name: Stop smoke test container
        if: always()
        run: docker rm -f latestarr-smoke || true
