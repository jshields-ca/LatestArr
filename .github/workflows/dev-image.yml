name: Dev image

# Publishes a floating `:dev` image on every push to the `dev` branch, so
# self-hosters testing in-progress work can track it via
# LATESTARR_VERSION=dev in docker-compose.yml — without a tagged release
# going through the full version/changelog/GitHub Release flow in
# release.yml. `dev` is a working branch merged into from feature
# branches as needed; it isn't kept in sync with main automatically.

on:
  push:
    branches: [dev]

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name is forced lowercase since GHCR (like all OCI registries)
      # rejects uppercase repository paths, and this repo's own name has a
      # capital A/R.
      - name: Build and push dev image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/jshields-ca/latestarr:dev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
