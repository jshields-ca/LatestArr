name: Release

# Automates the two-step flow CONTRIBUTING.md already describes: keep a
# "Version Packages" PR up to date while changesets are pending on main,
# then — once a maintainer merges it — cut the actual GitHub Release and
# publish that same version's image to GHCR. This app isn't published to
# npm (every workspace package is private), so there's no npm `publish`
# step here; "release" means a git tag, a GitHub Release with notes
# pulled straight from CHANGELOG.md, and a container image.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GITHUB_TOKEN here (as an env var, not just the action's own
      # `github-token` input) is what `pnpm version-packages` needs at
      # runtime — it's read by scripts/write-changelog.mjs's use of
      # @changesets/get-github-info to resolve each changeset's PR link,
      # and by `changeset version` itself for the per-package changelogs
      # (.changeset/config.json's changelog-github formatter). Both
      # degrade gracefully to "no link" without it, so this isn't
      # load-bearing for the release itself — just for the links.
      - name: Create/update Version Packages PR
        id: changesets
        uses: changesets/action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version-script: pnpm version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # changesets/action opens or updates a PR whenever changesets are
      # pending, and sets pr-number when it does. The one push where it
      # does *not* — no pending changesets, nothing to open — is the
      # push that just merged that same PR, which is exactly the push
      # that should become a release.
      - name: Check whether this push cut a new, untagged version
        id: check_version
        if: steps.changesets.outputs.pr-number == ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract this version's release notes from CHANGELOG.md
        if: steps.check_version.outputs.is_new == 'true'
        run: |
          node scripts/extract-changelog-section.mjs "${{ steps.check_version.outputs.version }}" > /tmp/release-notes.md

      - name: Create the tag and GitHub release
        if: steps.check_version.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.check_version.outputs.version }}" \
            --title "v${{ steps.check_version.outputs.version }}" \
            --notes-file /tmp/release-notes.md

      - name: Set up Docker Buildx
        if: steps.check_version.outputs.is_new == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.check_version.outputs.is_new == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest tracks the latest tagged *release*, not every main commit
      # — a self-hoster pulling :latest should always land on something
      # that went through the full version/changelog/release flow above,
      # never a mid-flight commit. Image name is forced lowercase since
      # GHCR (like all OCI registries) rejects uppercase repository paths,
      # and this repo's own name has a capital A/R.
      - name: Build and push image to GHCR
        if: steps.check_version.outputs.is_new == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/jshields-ca/latestarr:latest
            ghcr.io/jshields-ca/latestarr:v${{ steps.check_version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=v${{ steps.check_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
