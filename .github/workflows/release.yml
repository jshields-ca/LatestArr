name: Release

# Automates the two-step flow CONTRIBUTING.md already describes: keep a
# "Version Packages" PR up to date while changesets are pending on main,
# then — once a maintainer merges it — cut the actual GitHub Release and
# publish that same version's image to GHCR. This app isn't published to
# npm (every workspace package is private), so there's no npm `publish`
# step here; "release" means a git tag, a GitHub Release (notes built by
# scripts/build-release-notes.mjs from CHANGELOG.md plus the version's
# highlights file), and a container image.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GITHUB_TOKEN here (as an env var, not just the action's own
      # `github-token` input) is what `pnpm version-packages` needs at
      # runtime — it's read by scripts/write-changelog.mjs's use of
      # @changesets/get-github-info to resolve each changeset's PR link,
      # and by `changeset version` itself for the per-package changelogs
      # (.changeset/config.json's changelog-github formatter). Both
      # degrade gracefully to "no link" without it, so this isn't
      # load-bearing for the release itself — just for the links.
      - name: Create/update Version Packages PR
        id: changesets
        uses: changesets/action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version-script: pnpm version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # changesets/action opens or updates a PR whenever changesets are
      # pending, and sets pr-number when it does. The one push where it
      # does *not* — no pending changesets, nothing to open — is the
      # push that just merged that same PR, which is exactly the push
      # that should become a release.
      - name: Check whether this push cut a new, untagged version
        id: check_version
        if: steps.changesets.outputs.pr-number == ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      # One sticky comment on the Version Packages PR, updated in place on
      # every push, so writing highlights is a visible step before merging
      # rather than something to remember after the release is already out.
      # The file is checked on the PR branch, which changesets/action just
      # rebuilt from main — so highlights committed to that branch are lost
      # whenever another PR merges first, and this comment comes back.
      - name: Remind the maintainer to write release highlights
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --quiet origin changeset-release/main
          VERSION=$(git show origin/changeset-release/main:package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
          FILE=".github/release-highlights/v$VERSION.md"
          MARKER="<!-- release-highlights-reminder -->"
          EXISTING=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)

          if git cat-file -e "origin/changeset-release/main:$FILE" 2>/dev/null; then
            BODY="$MARKER
          ✅ Release highlights for **v$VERSION** are in \`$FILE\`."
          else
            TEMPLATE=$(cat .github/release-highlights/TEMPLATE.md)
            LINK="https://github.com/$REPO/new/changeset-release/main/.github/release-highlights?filename=v$VERSION.md&value=$(jq -rn --arg v "$TEMPLATE" '$v|@uri')"
            BODY="$MARKER
          ### ✍️ Write the release highlights before merging

          This PR will release **v$VERSION**. Add a short summary for the top of the GitHub Release: a one-line theme, then the few changes that matter most, in plain language.

          **[Write the highlights for v$VERSION]($LINK)** (opens the GitHub editor with a template, committed to this PR's branch)

          The **Release highlights** check stays red until the file exists. Write highlights just before merging: if another PR merges to \`main\` first, this branch is rebuilt and they need to be added again. See CONTRIBUTING.md, \"Release highlights\"."
          fi

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" > /dev/null
          fi

      - name: Build this version's release notes
        if: steps.check_version.outputs.is_new == 'true'
        run: |
          node scripts/build-release-notes.mjs "${{ steps.check_version.outputs.version }}" > /tmp/release-notes.md

      - name: Create the tag and GitHub release
        if: steps.check_version.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.check_version.outputs.version }}" \
            --title "v${{ steps.check_version.outputs.version }}" \
            --notes-file /tmp/release-notes.md

      - name: Set up Docker Buildx
        if: steps.check_version.outputs.is_new == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.check_version.outputs.is_new == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :latest tracks the latest tagged *release*, not every main commit
      # — a self-hoster pulling :latest should always land on something
      # that went through the full version/changelog/release flow above,
      # never a mid-flight commit. Image name is forced lowercase since
      # GHCR (like all OCI registries) rejects uppercase repository paths,
      # and this repo's own name has a capital A/R.
      - name: Build and push image to GHCR
        if: steps.check_version.outputs.is_new == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/jshields-ca/latestarr:latest
            ghcr.io/jshields-ca/latestarr:v${{ steps.check_version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=v${{ steps.check_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
