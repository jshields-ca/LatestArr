version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    ignore:
      # Must match the Node major the Docker image runs (docker/Dockerfile);
      # newer types would allow APIs that crash at runtime. Bump by hand
      # together with the image.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint doesn't support TypeScript 7 yet (see the
      # TypeScript 7 tracking issue); remove once it does.
      - dependency-name: "typescript"
        versions: [">=7"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
