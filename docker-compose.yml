# Pins the Compose project name so containers/volumes/networks are always
# named "latestarr-*" regardless of what directory this file lives in —
# without this, Compose derives the project name from the containing
# folder (e.g. a checkout at ~/docker/test-latestarr/ produces a container
# named "test-latestarr-latestarr-1").
name: latestarr

services:
  latestarr:
    container_name: latestarr
    # The published image, built for every tagged release, so there's
    # nothing to build. To build your own from a checkout instead, add
    # docker-compose.build.yml (see that file).
    image: ghcr.io/jshields-ca/latestarr:${LATESTARR_VERSION:-latest}
    ports:
      # Change the host side (left of the colon) via PORT in .env if 3000
      # collides with something else already running — the app inside the
      # container always listens on 3000, so nothing else needs to change.
      - "${PORT:-3000}:3000"
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      TZ: ${TZ:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
    volumes:
      # Named volume, not a bind mount, so a fresh checkout never
      # accidentally starts from someone else's committed ./data.
      - latestarr-data:/app/data
    restart: unless-stopped

volumes:
  latestarr-data:
